<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Rust orange gradient -->
    <linearGradient id="rustGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#F05A28"/>
      <stop offset="100%" style="stop-color:#CE4B1C"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#1a1a2e" filter="url(#shadow)"/>

  <!-- Rust gear/cog (simplified) - outer ring with teeth -->
  <g fill="url(#rustGradient)">
    <!-- Gear teeth -->
    <rect x="95" y="25" width="10" height="15" rx="2"/>
    <rect x="95" y="160" width="10" height="15" rx="2"/>
    <rect x="25" y="95" width="15" height="10" rx="2"/>
    <rect x="160" y="95" width="15" height="10" rx="2"/>
    <!-- Diagonal teeth -->
    <rect x="45" y="45" width="10" height="15" rx="2" transform="rotate(45 50 52.5)"/>
    <rect x="145" y="45" width="10" height="15" rx="2" transform="rotate(-45 150 52.5)"/>
    <rect x="45" y="140" width="10" height="15" rx="2" transform="rotate(-45 50 147.5)"/>
    <rect x="145" y="140" width="10" height="15" rx="2" transform="rotate(45 150 147.5)"/>

    <!-- Main gear ring -->
    <circle cx="100" cy="100" r="55" fill="none" stroke="url(#rustGradient)" stroke-width="12"/>

    <!-- Inner circle -->
    <circle cx="100" cy="100" r="25" fill="#1a1a2e"/>
    <circle cx="100" cy="100" r="25" fill="none" stroke="url(#rustGradient)" stroke-width="4"/>
  </g>

  <!-- Down arrow (representing "down" in rsdown and transform/conversion) -->
  <g fill="url(#arrowGradient)">
    <!-- Arrow body -->
    <rect x="92" y="70" width="16" height="40" rx="2"/>
    <!-- Arrow head -->
    <polygon points="100,135 75,105 87,105 87,100 113,100 113,105 125,105"/>
  </g>

  <!-- "RS" text (small, at bottom) -->
  <text x="100" y="165" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="bold" fill="#888">RS</text>
</svg>
